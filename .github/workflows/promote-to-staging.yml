name: Promote dev to staging

# Manual only: Actions tab > "Promote dev to staging" > Run workflow.
# The job also waits on the "staging-approval" environment, so add required
# reviewers there (Settings > Environments) for an extra confirmation click.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: promote-staging

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: staging-approval
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Merge dev into staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff origin/dev -m "Promote dev to staging"
          git push origin staging

  build:
    needs: promote
    uses: ./.github/workflows/build.yml
    with:
      ref: staging
      target: staging

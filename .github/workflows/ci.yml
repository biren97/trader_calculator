name: CI

# Runs on every push to the three long-lived branches and on pull requests.
on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      target: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'debug' }}
